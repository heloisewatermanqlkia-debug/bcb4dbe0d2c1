version: 2.1

jobs:
  svdrandomized:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load matrix
          command: |
            : > M.npy
      - run:
          name: Build decomposition
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target svdrandomized -j2
      - run:
          name: Randomized SVD
          command: LIONSS_LP=1 ./build/svdrandomized --matrix M.npy --rank 50
  wireguard_key:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed entropy
          command: |
            head -c 32 /dev/zero > seed.bin 2>/dev/null || printf 'seed\n' > seed.bin
      - run:
          name: Build key tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wireguard_key -j2
      - run:
          name: Derive WireGuard key
          command: LIONSS_LP=1 ./build/wireguard_key --seed seed.bin --type curve25519
  dedupeBlock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point volume
          command: |
            printf 'vol /mnt/v\n' > dedup.cfg
      - run:
          name: Build dedup engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dedupeBlock -j2
      - run:
          name: Deduplicate blocks
          command: LIONSS_LP=1 ./build/dedupeBlock --conf dedup.cfg --block 64k
  TmuxPane:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write layout
          command: |
            printf 'panes 4\n' > tmux.cfg
      - run:
          name: Build terminal mux
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TmuxPane -j2
      - run:
          name: Split tmux panes
          command: LIONSS_LP=1 ./build/TmuxPane --conf tmux.cfg --layout tiled
